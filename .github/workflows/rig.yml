name: rig

# The three-daemon tests. Nothing here builds a daemon from source *by design* —
# the question this repo asks is whether the three released artifacts work
# together, and a job that built them from HEAD would be asking a different
# question that each daemon's own CI already answers.
#
# Until the artifacts exist (see rig/README.md, "The bootstrap gap") this job
# runs the local path against each daemon's **default branch**, and says so in
# its name so nobody mistakes it for the real one. `rig_versions.toml` is
# therefore documentation at the moment: nothing reads it yet, and the day
# something does is the day this job stops building from source.
#
# The weekly run matters more here than on most suites. This one can go red
# without anybody touching this repository, because its entire subject is three
# things that move independently.

on:
  push:
    branches: [main]
    paths: ["rig/**", ".github/workflows/rig.yml"]
  pull_request:
    paths: ["rig/**", ".github/workflows/rig.yml"]
  # Weekly, because this suite can go red without anyone touching this repo:
  # its whole subject is three things that move independently.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  three-daemons-from-source:
    name: three daemons (from source — see README, bootstrap gap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: braemons/vstimd
          ref: "0.2"
          path: vstimd

      - uses: actions/checkout@v4
        with:
          repository: braemons/statemachined
          ref: main
          path: statemachined

      - uses: actions/checkout@v4
        with:
          repository: braemons/triald
          ref: main
          path: triald

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Copied from vstimd's own ci.yml, and that is the point rather than an
      # apology: building a daemon means knowing its system dependencies, which
      # is knowledge that belongs to that repo. A second copy here is a second
      # thing to keep in step, and it is only here because this job builds from
      # source at all. Installing a release would need none of it — see
      # rig/README.md, "The bootstrap gap".
      - name: System libraries the renderer needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libinput-dev libudev-dev libdrm-dev libwayland-dev protobuf-compiler

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vstimd

      - name: Build the renderer
        working-directory: vstimd
        run: cargo build --release

      # The generated protobuf stubs are gitignored, so a checkout of the client
      # is not an installable package until this runs. The published wheel has
      # them; a source install does not, which is one more reason this repo is
      # meant to install releases.
      - name: Generate the client's protobuf stubs
        working-directory: vstimd/client/python
        run: make proto

      # `integration-device` is the target statemachined's own integration tests
      # use, and it puts the binary where rig/tests/conftest.py expects it.
      - name: Build the native device
        working-directory: statemachined
        run: make integration-device

      - name: Run the three-daemon tests
        run: make rig-local
        env:
          VSTIMD: ${{ github.workspace }}/vstimd
          STATEMACHINED: ${{ github.workspace }}/statemachined
          TRIALD: ${{ github.workspace }}/triald

      - name: Lint
        working-directory: rig
        run: make lint
