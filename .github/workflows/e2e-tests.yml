name: e2e-tests

# The three-daemon tests, against nothing but published releases.
#
# **Nothing here builds a daemon, by design.** The question this repo asks is
# whether three *released artifacts* work together; a job that built them from
# HEAD would be asking a different question, and each daemon's own CI already
# answers that one. So this installs the .debs `e2e-tests/rig_versions.toml` pins,
# edits /etc/braemons, starts the daemons from the command lines their unit
# files run, and runs the tests against them — which is what an operator does,
# in the order an operator does it.
#
# It did build from source, until the artifacts existed. That job could not have
# stayed: it needed a copy of vstimd's system dependencies, it needed `make
# proto` because the client's generated stubs are gitignored, and it finally
# died on vstimd's build.rs refusing to build outside a tagged checkout — a
# shallow clone has no tags. Every one of those is a cost of building something
# this repo was never meant to build.
#
# The weekly run matters more here than on most suites. This one can go red
# without anybody touching this repository, because its entire subject is three
# things that move independently — and with the pins now naming real releases,
# a weekly red means an artifact was re-published or removed.

on:
  push:
    branches: [main]
    paths: ["e2e-tests/**", ".github/workflows/e2e-tests.yml"]
  pull_request:
    paths: ["e2e-tests/**", ".github/workflows/e2e-tests.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  three-daemons-from-releases:
    name: three daemons (from releases)
    runs-on: ubuntu-latest

    # fetch_artifacts.py shells out to `gh release download`, which wants a
    # token in the environment even for a public release. The default one is
    # enough: it is scoped to *this* repository, and the three it reads from are
    # public. Job-level rather than per-step because `make test` depends on
    # `artifacts` and would otherwise re-run the fetch without it.
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the pinned release artifacts
        run: make -C e2e-tests artifacts

      # What went in, in the log, next to the result. A red run's first question
      # is "which versions was that", and answering it should not need a rerun.
      - name: What is pinned
        run: |
          echo "::group::rig_versions.toml"
          cat e2e-tests/rig_versions.toml
          echo "::endgroup::"
          ls -lh e2e-tests/artifacts/
          cat e2e-tests/artifacts/requirements.txt

      # Installs the packages, configures /etc/braemons, starts both daemons and
      # the packaged device, runs the suite. It re-runs `artifacts`, which is
      # harmless; fetching in its own step above is what makes a fetch failure
      # legible as one rather than as a docker build error.
      - name: Install, configure, run
        run: make -C e2e-tests test

      - name: Lint
        run: make -C e2e-tests lint
