# The one claim this repo makes: these releases work together.
#
# Bumping a pin is a deliberate act. Nothing floats to "latest" — a rig
# integration suite that silently followed three moving targets would report
# breakage without saying which of the three moved, which is the one thing it
# exists to answer.
#
# **Every asset name here was read off the release, not guessed.** An earlier
# version of this file carried invented names; because the code that read them
# fell through to a local path when nothing matched, the release path never ran
# and nothing said so.

[vstimd]
repo = "braemons/vstimd"
tag = "v0.2.0-alpha1"
# `0.2.0.alpha1` in the filename, `0.2.0~alpha1` in the package metadata: nfpm
# writes a '.' where dpkg and rpm want the '~' that sorts a pre-release first.
version = "0.2.0.alpha1"
# The server. `braemons-` is the archive's prefix; nothing inside the package
# carries it.
asset = "braemons-vstimd_{version}-1_amd64.deb"
# The GPIO bridge from the same release. Only a rig with header pins needs it --
# run_on_hardware.py installs it on a Raspberry Pi, where it carries the state
# machine's TTL into vstimd's virtual trigger lines. The container has no GPIO.
gpiochip_daqd_asset = "braemons-gpiochip-daqd_{version}-1_amd64.deb"
# The client, from PyPI, because that is where a script's author gets it. A
# third spelling of the same tag -- PEP 440 normalises `0.2.0alpha1` to
# `0.2.0a1` -- and the reason this release exists: 0.1's client has no
# `vstimd.events` at all.
pypi = "vstimd-client"
pypi_version = "0.2.0a1"

[statemachined]
repo = "braemons/statemachined"
tag = "v0.2.0-alpha1"
# Note the spelling. The package version is `0.2.0~alpha1` -- the '~' is what
# makes dpkg and rpm sort a pre-release *before* the release -- but nfpm writes
# the filename with a '.'. Two spellings of one version, and this is the one
# the file is called.
version = "0.2.0.alpha1"
# Renamed from plain `statemachined` at this release; the package Provides,
# Conflicts and Replaces the old name, so an upgrade takes its files.
asset = "braemons-statemachined_{version}-1_amd64.deb"

# triald is the one these tests *import* rather than run, so what it owes them is
# a wheel -- and it publishes one beside the packages, which no other braemons
# daemon does. Both are pinned: the .deb because an operator installs it, the
# wheel because the tests need the outcome taxonomy and the trial-type models.
#
# The two carry different spellings of one version, and neither is negotiable.
# dpkg and rpm want `0.2.0.alpha1`; PEP 440 normalises the same tag to `0.2.0a1`.
[triald]
repo = "braemons/triald"
tag = "v0.2.0-alpha1"
version = "0.2.0.alpha1"
asset = "braemons-triald_{version}-1_amd64.deb"
# Not on PyPI -- publishing there is a separate decision with a token behind it,
# and nothing needs it yet. So the wheel is a release asset, fetched like the
# .deb and installed from the same directory. `wheel_version`, not `version`,
# because of the spelling split above.
wheel = "triald-{wheel_version}-py3-none-any.whl"
wheel_version = "0.2.0a1"
